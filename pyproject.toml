[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amst"
version = "1.0.0"
description = "Adversarial Moral Stress Testing (AMST) of Large Language Models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "statsmodels>=0.14",
  "matplotlib>=3.7", "pyyaml>=6.0", "requests>=2.31",
]

[project.optional-dependencies]
metrics = ["torch>=2.1", "transformers>=4.40", "detoxify>=0.5.2", "datasets>=2.18"]
test = ["pytest>=7.4"]

[project.scripts]
amst = "amst.cli:main"

[tool.setuptools.packages.find]
include = ["amst*"]

[tool.setuptools.package-data]
amst = ["../configs/*.yaml"]
